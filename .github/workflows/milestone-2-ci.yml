name: Kairos Feature CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/milestone-2-submission-status
      - feat/milestone-3-gradescope-connector
      - feat/milestone-6-multi-user-hosted-foundation
  workflow_dispatch:

concurrency:
  group: kairos-feature-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Check vinext compatibility
        continue-on-error: true
        run: npx vinext check
      - name: Build vinext Workers target
        continue-on-error: true
        run: npm run build:vinext
      - run: npm run build:extension
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - run: npm run build
      - run: node scripts/verify-dynamic-dashboard-build.mjs
      - name: Review prohibited credential/permission patterns
        run: git grep -nE '(cookies.*permission|<all_urls>|webRequest|authorization.*:|password.*(canvas|gradescope)|(canvas\.uw\.edu|gradescope\.com).*cookie|csrf.*gradescope)' -- extension src tests ':!tests/fixtures/**' || true
      - name: Publish feature CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          if [ "$JOB_STATUS" != "success" ]; then state=failure; fi
          curl -L --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"kairos-feature-ci\",\"description\":\"Kairos feature CI: $JOB_STATUS\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
