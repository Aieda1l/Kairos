name: Kairos Feature CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/milestone-2-submission-status
      - feat/milestone-3-gradescope-connector
      - feat/milestone-6-multi-user-hosted-foundation
      - feat/milestone-7-public-beta-readiness
  workflow_dispatch:

concurrency:
  group: kairos-feature-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run Vitest
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log
      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - run: npm run db:verify
      - name: Verify independent workerd admission and ownership
        run: npm run verify:workerd:abuse
      - name: Verify Turnstile with native workerd fetch
        run: node scripts/verify-workerd-turnstile.mjs
      - run: npm run build:extension
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            vitest.log
            lint.log
            typecheck.log
            playwright-report
            test-results
          if-no-files-found: ignore
      - run: npm run build
      - name: Check vinext compatibility
        run: npx vinext check
      - name: Build vinext Workers target
        run: npm run build:vinext
      - name: Verify compiled provider completion and recovery
        run: node scripts/verify-workerd-provider-completion.mjs
      - run: node scripts/verify-dynamic-dashboard-build.mjs
      - run: npm run verify:hosted
      - name: Review prohibited credential/permission patterns
        shell: bash
        run: |
          npm test -- tests/integration/secret-exposure.test.ts extension/firefox/tests/manifest.test.ts
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{30,}|ghp_[0-9A-Za-z]{30,}|sk-[0-9A-Za-z]{20,}' -- src extension ':!extension/firefox/dist/**'; then
            echo "Potential committed credential pattern detected."
            exit 1
          fi
  publish-status:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # This job never checks out or executes repository/PR code.
      - uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: process.env.VERIFY_RESULT === 'success' ? 'success' : 'failure',
              context: 'kairos-feature-ci', description: 'Kairos verification: ' + process.env.VERIFY_RESULT,
              target_url: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
            });
