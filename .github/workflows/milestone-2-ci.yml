name: Kairos Feature CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/milestone-2-submission-status
      - feat/milestone-3-gradescope-connector
      - feat/milestone-6-multi-user-hosted-foundation
  workflow_dispatch:

concurrency:
  group: kairos-feature-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run Vitest
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log
      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - run: npm run db:verify
      - run: npm run build:extension
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            vitest.log
            lint.log
            typecheck.log
            playwright-report
            test-results
          if-no-files-found: ignore
      - run: npm run build
      - name: Check vinext compatibility
        run: npx vinext check
      - name: Build vinext Workers target
        run: npm run build:vinext
      - run: node scripts/verify-dynamic-dashboard-build.mjs
      - run: npm run verify:hosted
      - name: Review prohibited credential/permission patterns
        shell: bash
        run: |
          npm test -- tests/integration/secret-exposure.test.ts extension/firefox/tests/manifest.test.ts
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{30,}|ghp_[0-9A-Za-z]{30,}|sk-[0-9A-Za-z]{20,}' -- src extension ':!extension/firefox/dist/**'; then
            echo "Potential committed credential pattern detected."
            exit 1
          fi
      - name: Publish feature CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          if [ "$JOB_STATUS" != "success" ]; then state=failure; fi
          curl -L --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"kairos-feature-ci\",\"description\":\"Kairos feature CI: $JOB_STATUS\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
