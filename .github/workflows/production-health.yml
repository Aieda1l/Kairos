name: Kairos Production Health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/fix/production-health-403'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-health-edge.mjs
