<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Kairos hourglass K</title>
  <defs>
    <linearGradient id="rim" x1="70" y1="40" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a66cff"/>
      <stop offset=".45" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4b2e83"/>
    </linearGradient>
    <radialGradient id="panel" cx="180" cy="100" r="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262640"/>
      <stop offset=".6" stop-color="#171725"/>
      <stop offset="1" stop-color="#101018"/>
    </radialGradient>
    <linearGradient id="white" x1="115" y1="90" x2="405" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".55" stop-color="#eee8ff"/>
      <stop offset="1" stop-color="#c8b5ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="135" y1="130" x2="245" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b273ff"/>
      <stop offset=".45" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="arm" x1="235" y1="145" x2="405" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".58" stop-color="#f0eaff"/>
      <stop offset="1" stop-color="#b99bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="100" fill="url(#rim)"/>
  <rect x="30" y="30" width="452" height="452" rx="90" fill="url(#panel)"/>

  <g filter="url(#shadow)">
    <!-- Hourglass frame forming the left stroke of K -->
    <path d="M108 112H238M108 400H238" stroke="url(#white)" stroke-width="28" stroke-linecap="round"/>
    <path d="M118 126v72c0 34 18 55 48 78 26 20 26 40 0 60-30 23-48 44-48 78v-4M228 126v72c0 34-18 55-48 78-26 20-26 40 0 60 30 23 48 44 48 78v-4"
      fill="none" stroke="url(#white)" stroke-width="23" stroke-linecap="round"/>

    <!-- Purple sand -->
    <path d="M136 154h74v37c0 24-15 43-37 61-22-18-37-37-37-61z" fill="url(#purple)"/>
    <path d="M136 374c5-30 21-51 37-68 17 17 33 38 37 68z" fill="url(#purple)"/>
    <circle cx="173" cy="274" r="5" fill="#e3d4ff"/>
    <circle cx="173" cy="292" r="4.5" fill="#d3b9ff"/>
    <circle cx="173" cy="309" r="4" fill="#c19cff"/>

    <!-- K arms -->
    <path d="M218 257 343 126h70L292 256l122 130h-73L218 277c-7-6-7-14 0-20z" fill="url(#arm)"/>
    <path d="M292 256 414 386h-30L266 276c-13-12-13-27 0-40l117-110h30z" fill="#6d28d9" opacity=".55"/>
  </g>
</svg>
